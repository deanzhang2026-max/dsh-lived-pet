# dsh-pet-bridge bundle patch
#
# Inserts the bridge into a profile's layer stack. `config` is passed straight
# to `apply(ctx, config)` in index.js.
#
# statePath  OPTIONAL. Leave it out and the bridge uses a location the bundled
#            desktop pet also resolves by default:
#                $DSH_HOME/pet_state.json     (~/.dsh/pet_state.json)
#            The DSH_PET_STATE environment variable overrides the default, and
#            this config overrides both. Only set it if you want the file
#            somewhere unusual.
# title      Bubble header line.
# minGapMs   Minimum gap between writes, so a burst of tool calls cannot
#            thrash the disk. State transitions always publish immediately.

- insert:
    - id: pet-bridge
      name: dsh-pet-bridge
      config:
        title: 'DSH Agent'
        minGapMs: 200